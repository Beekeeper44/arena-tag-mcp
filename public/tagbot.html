<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tag Bot · Arena Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f7f1; --panel:#ffffff; --panel2:#e9f0e7; --line:#cfdcca; --text:#11261a; --dim:#5b7462;
  --go:#0f7a1f; --go-ink:#ffffff; --warn:#9a5700; --warn-bg:#fff1d6; --off:#b9c7b5;
  --mono:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#050b07; --panel:#0a140d; --panel2:#0f1d13; --line:#1d3523; --text:#d5f3da; --dim:#6d8d74;
    --go:#39FF14; --go-ink:#031005; --warn:#ffb000; --warn-bg:#231800; --off:#24382a;
  }
}
:root[data-theme="dark"]{
  --bg:#050b07; --panel:#0a140d; --panel2:#0f1d13; --line:#1d3523; --text:#d5f3da; --dim:#6d8d74;
  --go:#39FF14; --go-ink:#031005; --warn:#ffb000; --warn-bg:#231800; --off:#24382a;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 var(--mono);padding-bottom:calc(92px + env(safe-area-inset-bottom,0px))}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--go);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 18px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{margin:0;font-size:20px;font-weight:800}
h1 span{color:var(--go)}
.dim{color:var(--dim)}
.small{font-size:12px}

/* request */
.ask{display:flex;gap:8px}
.ask textarea{flex:1;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);font-size:15px;line-height:1.45;resize:none;overflow:hidden;min-height:50px;max-height:200px}
.ask{align-items:flex-start}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:9px 14px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--go)}
.btn.primary{background:var(--go);color:var(--go-ink);border-color:var(--go);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.danger{background:var(--warn);color:#1a0f00;border-color:var(--warn);font-weight:700}
.taglist{margin:10px 0 0;padding:0;list-style:none}
.taglist li{display:flex;justify-content:space-between;border-bottom:1px dotted var(--line);padding:3px 0}
.btn.link{background:none;border:none;padding:4px 6px;color:var(--dim);text-decoration:underline;text-underline-offset:3px}
.tabs{display:flex;gap:4px;border:1px solid var(--line);border-radius:10px;padding:3px;background:var(--panel)}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--dim);font-weight:500;display:flex;gap:6px;align-items:center}
.tabs button[aria-selected="true"]{background:var(--go);color:var(--go-ink);font-weight:700}
.count-badge{font-size:11px;border-radius:999px;padding:0 6px;border:1px solid currentColor}
.source{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px 12px;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.source.real{border-color:var(--warn)}
.srcacts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.how{flex-basis:100%;color:var(--dim)}
#srcMsg{flex-basis:100%}
#srcMsg:empty{display:none}
.drop body,.dropping{outline:3px dashed var(--go);outline-offset:-10px}
.slab .art{position:relative;overflow:hidden}
.slab .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#0b0f0c;padding:4px}
.more{margin-top:10px;text-align:center}
.mode{margin-left:6px;border:1px solid var(--warn);color:var(--warn);border-radius:5px;padding:0 6px;font-size:11.5px;font-weight:700}
.mode.live{border-color:var(--go);color:var(--go)}
.login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;z-index:50;padding:20px}
.loginbox{width:min(380px,100%);border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:22px;display:flex;flex-direction:column;gap:12px}
.loginbox h2{margin:0 0 4px;font-size:20px}.loginbox h2 span{color:var(--go)}
.loginbox label{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--dim)}
.loginbox input{padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--go);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.btn.mic{display:inline-flex;align-items:center;gap:4px}
.btn.mic[aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#1a0f00;font-weight:700}
.btn.mic[aria-pressed="true"]::after{content:"";width:8px;height:8px;border-radius:50%;background:#c00;margin-left:4px;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.voicenote{min-height:0;font-size:12px;color:var(--dim);margin-top:4px}
.voicenote:empty{display:none}
@media (prefers-reduced-motion: reduce){.btn.mic[aria-pressed="true"]::after{animation:none}}
.savednote{min-height:18px;margin-top:6px;color:var(--go)}
.foot{margin-top:28px}
.saved{display:flex;flex-direction:column;gap:10px}
.sp{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
@media (max-width:720px){.sp{grid-template-columns:1fr}}
.sp .nm{font-weight:700}
.sp .nm input{font-weight:700;border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:4px 8px;width:100%}
.sp .tx{color:var(--dim);font-size:12.5px;margin-top:2px}
.sp .acts{display:flex;gap:6px;flex-wrap:wrap}
.examples{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.ex{border:1px dashed var(--line);background:transparent;border-radius:6px;padding:4px 8px;font-size:12px;cursor:pointer;color:var(--dim);text-align:left}
.ex:hover{color:var(--text);border-color:var(--go)}

/* summary */
.summary{margin-top:18px;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);display:grid;grid-template-columns:1fr auto;gap:12px 18px;align-items:center}
@media (max-width:720px){.summary{grid-template-columns:1fr}}
@media (max-width:560px){.ask{flex-wrap:wrap}.ask textarea{flex-basis:100%}.ask .btn{flex:1}.btn.mic{flex:0 0 auto}}
.tagline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 11px;cursor:pointer;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--go);color:var(--go-ink);font-weight:700}
.tagfield{display:flex;align-items:center;border:1.5px solid var(--go);border-radius:8px;padding:0 10px;background:var(--bg)}
.tagfield input{border:0;background:transparent;padding:8px 0;font-weight:700;font-size:16px;width:min(260px,52vw);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:2px 9px;font-size:12px}
.chip i{font-style:normal;color:var(--dim)}
.totals{text-align:right}
@media (max-width:720px){.totals{text-align:left}}
.totals .n{font-size:26px;font-weight:800;line-height:1}
.selbar{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
@media (max-width:720px){.selbar{justify-content:flex-start}}
.warn{grid-column:1/-1;background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;padding:8px 10px;font-size:12.5px}
.warn b{color:var(--warn)}

/* grid of cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(186px,1fr));gap:12px;margin-top:14px}
.tile{position:relative;border:1.5px solid var(--line);border-radius:12px;background:var(--panel);padding:10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;transition:border-color .15s,opacity .15s}
.tile[aria-pressed="true"]{border-color:var(--go)}
.tile[aria-pressed="false"]{opacity:.45}
.tw{position:relative;display:flex}
a.btn{color:var(--text);text-decoration:none;display:inline-flex;align-items:center}
.tw .slab .lbl{padding-left:36px;padding-right:36px}
.tw .tile{flex:1}
.infob{position:absolute;top:8px;left:8px;z-index:2;width:24px;height:24px;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:13px;font-weight:700;cursor:pointer;display:grid;place-items:center}
.infob:hover{color:var(--text);border-color:var(--go)}
.facts{font-size:11px;color:var(--dim);line-height:1.45}
.facts b{color:var(--text);font-weight:500}
dialog.info{max-width:760px;width:calc(100% - 32px);padding:0}
.info .in{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:18px;padding:18px}
@media (max-width:640px){.info .in{grid-template-columns:1fr}}
.info .pic{background:#0b0f0c;border:1px solid var(--line);border-radius:10px;min-height:260px;display:grid;place-items:center;overflow:hidden}
.info .pic img{width:100%;height:100%;max-height:460px;object-fit:contain}
.info h2{margin:0 0 2px;font-size:18px}
.info dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 14px;margin:12px 0;font-size:12.5px}
.info dt{color:var(--dim)}.info dd{margin:0;word-break:break-word}
.info .acts{display:flex;gap:8px;justify-content:flex-end;padding:0 18px 16px;flex-wrap:wrap}
.tile .check{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:13px;font-weight:800;background:var(--panel)}
.tile[aria-pressed="true"] .check{background:var(--go);border-color:var(--go);color:var(--go-ink)}
.slab{border:2px solid var(--off);border-radius:8px;overflow:hidden;background:var(--panel2)}
.slab .lbl{display:flex;justify-content:space-between;font-size:10.5px;font-weight:700;padding:4px 7px;background:var(--bg);border-bottom:1px solid var(--off)}
.slab .art{height:210px;display:grid;place-items:center;font-size:26px;font-weight:800;letter-spacing:-.02em;color:#ffffffd9}
.name{font-weight:700;font-size:13px;line-height:1.3}
.meta{font-size:11.5px;color:var(--dim);line-height:1.35}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px}
.ev{font-weight:700}
.tagchange{font-size:11.5px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.pill{border:1px solid var(--line);border-radius:5px;padding:0 5px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill.new{border-color:var(--go);color:var(--go)}
.pill.old{border-color:var(--warn);color:var(--warn);text-decoration:line-through}
.done-badge{font-size:11.5px;color:var(--go);font-weight:700}
.pill.none{border-style:dashed;color:var(--dim)}
.nowline{display:flex;gap:5px;align-items:center;flex-wrap:wrap;width:100%}
.summary.result{border-color:var(--go)}
.rh{font-size:17px;font-weight:800;color:var(--go)}
.tile.changed{border-color:var(--go)}

.empty{margin-top:28px;padding:28px;border:1px dashed var(--line);border-radius:12px;text-align:center;color:var(--dim)}

/* sticky confirm bar */
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.bar .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .msg{flex:1;min-width:200px}
.bar .big{padding:12px 20px;font-size:15px}
.tog{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);cursor:pointer}
.progress{height:5px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.progress span{display:block;height:100%;width:0;background:var(--go);transition:width .12s}

/* activity */
details.activity{margin-top:22px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.activity summary{cursor:pointer;padding:10px 14px;color:var(--dim);font-size:12.5px}
.log{max-height:280px;overflow:auto;padding:4px 14px 12px;font-size:11.5px}
.log div{padding:2px 0;border-bottom:1px dotted var(--line);word-break:break-word}
.log .w{color:var(--warn)}
.history{margin-top:12px}
.history table{border-collapse:collapse;width:100%;font-size:12px}
.history td,.history th{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.history th{color:var(--dim);font-weight:500}
.tblwrap{overflow-x:auto}

dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);padding:20px;max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:#000a}
dialog.info::backdrop{background:#000c}
dialog h2{margin:0 0 8px;font-size:17px}
dialog .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Tag <span>Bot</span></h1>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tabBtn-request" aria-selected="true" aria-controls="tab-request" type="button">Request</button>
      <button role="tab" id="tabBtn-saved" aria-selected="false" aria-controls="tab-saved" type="button">Saved prompts <span class="count-badge" id="savedCount" hidden></span></button>
    </nav>
  </div>

  <section id="tab-request" role="tabpanel" aria-labelledby="tabBtn-request">
    <div class="source live" id="source">
      <div><span class="dim">Cards:</span> <b>Live · Metabase 4131, fresh every search</b> <span class="dim" id="srcCount"></span> <span class="mode" id="modeBadge"></span></div>
      <div class="srcacts">
        <span class="dim small" id="whoami"></span>
        <button class="btn link" type="button" id="logoutBtn">Sign out</button>
      </div>
      <div id="srcMsg" class="small" aria-live="polite"></div>
    </div>
    <form class="ask" id="form" autocomplete="off">
      <textarea rows="1" id="input" aria-label="What should I tag?" placeholder="Type or use voice: tag wemby psa 10 over $200 as sd_wemby_grail"></textarea>
      <button class="btn mic" type="button" id="micBtn" aria-pressed="false" title="Use your voice instead of typing">🎤<span class="mictxt"> Voice</span></button>
      <button class="btn" type="button" id="saveBtn">Save prompt</button>
      <button class="btn primary" type="submit">Find cards</button>
    </form>
    <div class="savednote small" id="saveNote" aria-live="polite"></div>
    <div class="voicenote" id="voiceNote" aria-live="polite"></div>

    <div id="summary"></div>
    <div id="grid"></div>
    <div id="empty" class="empty">Type what you want tagged. You'll see every matching card before anything changes.</div>

    <details class="activity" id="activity">
      <summary>Recent runs</summary>
      <div class="history tblwrap" id="history"><div class="dim small" style="padding:10px 14px">No runs yet.</div></div>
    </details>
  </section>

  <section id="tab-saved" role="tabpanel" aria-labelledby="tabBtn-saved" hidden>
    <div id="savedList"></div>
  </section>
  <p class="dim small foot" id="foot">Tags are written to Arena Club admin. Every run is logged and can be undone.</p>
</div>

<div class="login" id="login" hidden>
  <form class="loginbox" id="loginForm" autocomplete="on">
    <h2>Tag <span>Bot</span></h2>
    <label>Your name<input id="lname" autocomplete="name" required></label>
    <label id="lpassWrap">Team password<input id="lpass" type="password" autocomplete="current-password"></label>
    <div id="lerr" class="small" style="color:var(--warn);min-height:18px"></div>
    <button class="btn primary big" type="submit">Continue</button>
    <div class="dim small">Your name is recorded on every run you make.</div>
  </form>
</div>

<div class="bar" id="bar" hidden>
  <div class="in">
    <div class="msg" id="barmsg"></div>
    <label class="tog" id="dryWrap"><input type="checkbox" id="dry"> Dry run</label>
    <button class="btn" id="newBtn" type="button">New request</button>
    <button class="btn primary big" id="confirmBtn" type="button">Confirm tags</button>
  </div>
</div>

<dialog id="info" class="info" aria-label="Card details"></dialog>
<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <div id="dlgBody" class="small"></div>
  <label id="dlgTypeWrap" class="small" style="display:block;margin-top:12px" hidden>Type <b id="dlgWord"></b> to confirm
    <input id="dlgType" autocomplete="off" style="display:block;width:100%;margin-top:6px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)"></label>
  <div class="acts"><button class="btn" id="dlgNo" type="button">Go back</button><button class="btn primary" id="dlgYes" type="button">Yes, tag them</button></div>
</dialog>

<script>
/* ---------- request reader, driven by whatever cards are loaded (demo or an Arena export) ---------- */
const GENERIC_SETS=["prizm","topps chrome","chrome","bowman chrome","bowman","select","optic","donruss","mosaic","national treasures","flawless","immaculate","contenders","finest","stadium club","upper deck","base set","151","evolving skies","crown zenith","evolutions","fusion strike","paldea evolved","obsidian flames","scarlet & violet","scarlet and violet","sword & shield","jungle","fossil","team rocket","neo genesis"];
const GENERIC_PARALLELS=["ruby wave","gold wave","blue shimmer","refractor","silver","gold","illustration rare","special illustration rare","reverse holo","1st edition","holo","shadowless","full art","alt art","auto","autograph","patch","numbered"];
const STOP=new Set(("tag tags tagging tagged all the cards card and or with as between over under above below every from remove clear currently skip that already have "+
 "only untagged dont don't overwrite existing more than less least most graded grade grades in on set sets any my please dollars dollar each these those them it its of to for "+
 "a an is are be into onto new pack packs slab slabs raw give put add apply make want need would like just also plus minus value values estimated worth price priced range "+
 "rookie rookies rc parallel parallels numbered base first edition holo holos rare rares reverse illustration wave ruby gold blue shimmer silver refractor refractors "+
 "psa bgs sgc cgc chrome topps panini prizm select optic donruss bowman evolving skies crown zenith evolutions pokemon basketball baseball football hockey soccer sport sports "+
 "player players character characters cheap expensive high low end top best whole entire inventory warehouse no not without delete untag take off card's cards' "+
 "arena club only just please thanks").split(" "));
const SUFFIX=new Set(["jr","jr.","sr","sr.","ii","iii","iv","ex","gx","v","vmax","vstar","lv.x","star","δ"]);
const ALIAS={wemby:"Wembanyama",caitlin:"Clark",shohei:"Ohtani",cj:"Stroud","c.j.":"Stroud",cooper:"Flagg",zard:"Charizard",pika:"Pikachu",mj:"Michael Jordan",lebron:"LeBron James",kobe:"Kobe Bryant"};
let LEX=null;
const words=s=>String(s||"").toLowerCase().split(/[^a-z0-9.&é]+/).filter(Boolean);
function buildLexicon(cards){
  const full=new Map(), last=new Map(), lastParts=new Map(), nameParts=new Set(), vocab=new Set();
  const sets=new Set(GENERIC_SETS), pars=new Set(GENERIC_PARALLELS), sports=new Set(["pokemon"]);
  for(const c of cards){
    if(c.player_name){
      const nm=c.player_name.trim(), lw=nm.toLowerCase();
      const parts=words(nm).filter(w=>!SUFFIX.has(w));
      parts.forEach(w=>nameParts.add(w));
      const key=parts.length?parts[parts.length-1]:lw;
      const disp=nm.split(/\s+/).filter(w=>!SUFFIX.has(w.toLowerCase()));
      const filterVal=(disp[disp.length-1]||nm).replace(/[.,]$/,"");
      full.set(lw,nm.replace(/\s+(jr\.?|sr\.?|ii|iii|iv)$/i,""));
      if(key.length>=3){ if(!last.has(key)) last.set(key,filterVal); if(!lastParts.has(key)) lastParts.set(key,new Set()); parts.forEach(w=>lastParts.get(key).add(w)); }
    }
    if(c.set_name){ const noYear=c.set_name.toLowerCase().replace(/^\s*\d{4}(-\d{2})?\s+/,"").trim(); if(noYear.length>=4) sets.add(noYear); words(c.set_name).forEach(w=>vocab.add(w)); }
    if(c.parallel_name){ pars.add(c.parallel_name.toLowerCase().trim()); words(c.parallel_name).forEach(w=>vocab.add(w)); }
    if(c.sport){ sports.add(c.sport.toLowerCase()); vocab.add(c.sport.toLowerCase()); }
  }
  const byLen=a=>[...a].sort((x,y)=>y.length-x.length);
  return {full,last,lastParts,nameParts,vocab,sets:byLen(sets),pars:byLen(pars),sports:[...sports]};
}
const hasPhrase=(t,p)=>new RegExp("(^|[^a-z0-9])"+p.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es)?($|[^a-z0-9])").test(t);

function readRequest(text){
  if(!LEX) LEX=buildLexicon([]);
  const t=text.toLowerCase().replace(/[’']/g,"'").replace(/pokémon/g,"pokemon"); const f={}; let action="set", tag=null, mode="overwrite";
  if(/\b(clear|remove|untag|take off|delete)\b/.test(t)) action="clear";
  const ct=t.match(/(?:currently tagged|already tagged|tagged with|tagged|with (?:the )?tag|that have(?: the tag)?|have tag)\s+#?([a-z0-9_]+)/);
  if(ct && /_/.test(ct[1])) f.tag=ct[1];
  if(action==="set"){
    const raw=text.replace(/[’']/g,"'");
    const norm=w=>w.toLowerCase().replace(/-/g,"_").replace(/[^a-z0-9_]/g,"");
    const hash=raw.match(/#([A-Za-z0-9_-]+)/g);
    const colon=raw.match(/\btag\s*[:=]\s*#?([A-Za-z0-9_-]+)/i);
    const as=raw.match(/\b(?:as|to|with tag|tag it|tag them)\s+#?([A-Za-z0-9]+[_-][A-Za-z0-9_-]+)/i);
    const snake=[...raw.matchAll(/\b([A-Za-z][A-Za-z0-9]*_[A-Za-z0-9_]+)\b/g)].map(m=>norm(m[1])).filter(w=>w!==f.tag);
    tag=hash?norm(hash[hash.length-1].slice(1)):colon?norm(colon[1]):as?norm(as[1]):(snake.length?snake[snake.length-1]:null);
    if(tag===f.tag) tag=null;
  }
  if(/skip|only untagged|don'?t overwrite|do not overwrite|no tag yet|without a tag|untagged/.test(t)) mode="skip_tagged";

  // strip tag words and prices before looking for names, sets and parallels
  const body=t.replace(/#[a-z0-9_-]+/g," ").replace(/\btag\s*[:=]\s*[a-z0-9_-]+/g," ").replace(/\b[a-z0-9]+(?:[_-][a-z0-9]+)+\b/g," ").replace(/\$\s*[\d,.]+k?/g," ");

  // set and parallel phrases (longest first) — consume their words so they aren't read as names
  let rest=" "+body+" ";
  for(const ph of LEX.sets){ if(hasPhrase(rest,ph)){ f.set_name=ph.replace(/\b\w/g,c=>c.toUpperCase()); rest=rest.replace(ph," "); break; } }
  const yr=body.match(/\b((?:19|20)\d\d)\b/); if(yr){ f.set_name=f.set_name?`${yr[1]}%${f.set_name}`:yr[1]; }
  for(const ph of LEX.pars){ if(hasPhrase(rest,ph)){ f.parallel_name=ph.replace(/\b\w/g,c=>c.toUpperCase()); rest=rest.replace(new RegExp(ph.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es)?","g")," "); break; } }
  if(/\bbase\b/.test(rest)&&!f.parallel_name&&!/base set/.test(body)) f.parallel_name="__base__";
  for(const sp of LEX.sports) if(hasPhrase(body,sp)) f.sport=sp;

  // names: full names, then last names, nicknames, close spellings; every other unknown word stays as a name
  const names=[], used=new Set();
  const add=(v,ws)=>{ if(!names.some(n=>n.toLowerCase()===v.toLowerCase())) names.push(v); ws.forEach(w=>used.add(w)); };
  for(const [lw,val] of LEX.full){ if(lw.length>=4&&hasPhrase(rest,lw)) add(val,words(lw)); }
  const toks=rest.split(/[^a-z.&]+/).filter(Boolean);
  for(const w of toks){
    if(used.has(w)) continue;
    const w1=w.replace(/'s$/,"");
    if(ALIAS[w1]) { const k=ALIAS[w1].toLowerCase().split(" ").pop(); add(ALIAS[w1],[w,...(LEX.lastParts.get(k)||[])]); continue; }
    if(LEX.last.has(w1)) { add(LEX.last.get(w1),[w,...LEX.lastParts.get(w1)]); continue; }
    if(w1.endsWith("s")&&LEX.last.has(w1.slice(0,-1))) { const k=w1.slice(0,-1); add(LEX.last.get(k),[w,...LEX.lastParts.get(k)]); continue; }
  }
  for(const w of toks){
    if(used.has(w)||STOP.has(w)||LEX.vocab.has(w)||w.length<5||LEX.nameParts.has(w)) continue;
    const cands=[...new Set([...LEX.last.entries()].filter(([k])=>k.length>=5&&k.slice(0,5)===w.slice(0,5)).map(([,v])=>v))];
    if(cands.length>=1&&cands.length<=2){ for(const [k,v] of LEX.last) if(cands.includes(v)) add(v,[w,...LEX.lastParts.get(k)]); }
  }
  // a first name on its own (e.g. "victor") only counts if no full/last name used it
  for(const w of toks){ if(!used.has(w)&&LEX.nameParts.has(w)&&!STOP.has(w)&&w.length>=4&&!LEX.vocab.has(w)) add(w.charAt(0).toUpperCase()+w.slice(1),[w]); }
  const unknown=toks.filter(w=>/^[a-z]{4,}$/.test(w)&&!used.has(w)&&!STOP.has(w)&&!STOP.has(w.replace(/s$/,""))&&!LEX.vocab.has(w)&&!LEX.nameParts.has(w));
  for(const w of unknown) add(w.charAt(0).toUpperCase()+w.slice(1),[w]);
  if(names.length) f.player_name=names.length===1?names[0]:names;

  const gm=body.match(/\b(psa|bgs|sgc|cgc)\s*(\d{1,2}(?:\.5)?)?s?\b/);
  if(gm){f.grading_company=gm[1]; if(gm[2]) f.grade=`${gm[1]} ${gm[2]}`}
  const money='\\$?\\s*([\\d,]+(?:\\.\\d+)?)\\s*(k)?';
  const val=(n,k)=>Number(String(n).replace(/,/g,""))*(k?1000:1);
  const bw=t.match(new RegExp('between\\s*'+money+'\\s*(?:and|to|-|–)\\s*'+money))||t.match(new RegExp('\\$\\s*([\\d,]+)\\s*(k)?\\s*(?:-|–|to)\\s*\\$?\\s*([\\d,]+)\\s*(k)?'));
  if(bw){f.min_estimated_value=val(bw[1],bw[2]);f.max_estimated_value=val(bw[3],bw[4])}
  else{
    const ov=t.match(new RegExp('(?:over|above|more than|at least|min(?:imum)?|>=?)\\s*'+money)); if(ov) f.min_estimated_value=val(ov[1],ov[2]);
    const un=t.match(new RegExp('(?:under|below|less than|at most|max(?:imum)?|<=?)\\s*'+money)); if(un) f.max_estimated_value=val(un[1],un[2]);
    const plus=t.match(/\$\s*([\d,]+)\s*\+/); if(plus&&f.min_estimated_value==null) f.min_estimated_value=val(plus[1]);
  }
  return {action,tag,mode,filters:f};
}

async function find(text){
  requestAnimationFrame(()=>{const i=$("#input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight+2,200)+"px"});
  if(!text.trim()) return;
  const seq=++findSeq;

  let res;

  catch(e){ if(seq===findSeq) showEmpty(e.message); return; }
  if(seq!==findSeq) return;
  const at=new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit",second:"2-digit"});
  $("#srcCount").textContent=`· ${res.total.toLocaleString()} matching · pulled ${at} (${(res.ms/1000).toFixed(1)}s)`;
  if(!res.has_filter){ showEmpty("Add at least one filter: a player, set, parallel, grade, value range, AC number or cert number."); return; }

  S={queries:res.queries, action:p.action, mode:p.mode, filters:p.filters, post:p.post_filters, tag:p.tag||"", matched:res.cards, total:res.total, missing:res.missing||[], phase:"review", prev:new Map(), limit:240};

function recompute(resetSelection){

  else S.selected=new Set([...S.selected].filter(id=>S.rows.some(r=>r.item_id===id)));

}

$("#grid").addEventListener("click",e=>{if(e.target.closest(".infob"))return;const t=e.target.closest(".tile");if(!t||!S||S.phase!=="review")return;const id=t.dataset.id;S.selected.has(id)?S.selected.delete(id):S.selected.add(id);render()});

/* ---------- confirm + write ---------- */
/* one confirmation dialog used for tagging, removing and undo */
function ask({title,body,yes,danger=false,word=null}){
  return new Promise(res=>{
    const d=$("#dlg"), y=$("#dlgYes"), n=$("#dlgNo"), tw=$("#dlgTypeWrap"), ti=$("#dlgType");
    $("#dlgTitle").textContent=title; $("#dlgBody").innerHTML=body;
    y.textContent=yes; y.className="btn "+(danger?"danger":"primary");
    tw.hidden=!word; ti.value=""; if(word)$("#dlgWord").textContent=word;
    y.disabled=!!word;
    ti.oninput=()=>{y.disabled=ti.value.trim().toLowerCase()!==String(word).toLowerCase()};
    const done=v=>{d.close();y.onclick=n.onclick=d.oncancel=null;res(v)};
    y.onclick=()=>done(true); n.onclick=()=>done(false); d.oncancel=()=>done(false);
    d.showModal(); if(word) ti.focus();
  });
}
const tagCounts=rows=>{const m=new Map();rows.forEach(r=>{const k=r.tag||"(no tag)";m.set(k,(m.get(k)||0)+1)});return `<ul class="taglist">${[...m].sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<li><span>${esc(t)}</span><span>${n}</span></li>`).join("")}</ul>`};

$("#confirmBtn").onclick=async()=>{
  const sel=S.rows.filter(r=>S.selected.has(r.item_id));
  const dry=$("#dry").checked;
  const dryNote=dry?"<b>Dry run:</b> records what would change without writing to admin.<br><br>":"";
  let ok;
  if(S.action==="set"){
    const rep=sel.filter(r=>r.tag&&r.tag!==S.tag).length;
    ok=await ask({title:`Tag ${sel.length} cards as ${S.tag}?`,
      body:`${dryNote}${rep?`${rep} of them currently have another tag that will be replaced:`+tagCounts(sel.filter(r=>r.tag&&r.tag!==S.tag))+"<br>":""}You can undo this afterward.`,
      yes:dry?"Run dry run":"Yes, tag them"});
  }else{
    ok=await ask({title:`Remove tags from ${sel.length} cards?`,
      body:`${dryNote}These tags will be removed:${tagCounts(sel)}<br>The cards will have no tag afterward. You can undo this.`,
      yes:dry?"Run dry run":"Yes, remove tags", danger:!dry, word:dry?null:String(sel.length)});
  }
  if(ok) run(sel,dry);
};

async function run(sel,dry){
  S.phase="working"; S.undone=false; S.showAll=false; S.prevAll=new Map(sel.map(r=>[r.item_id,r.tag])); render(); $("#dryWrap").hidden=true;
  const target=S.action==="set"?S.tag:null;
  $("#confirmBtn").hidden=true;
  $("#barmsg").innerHTML=`<span class="spin"></span>${dry?"Dry run":"Writing to admin"}… ${sel.length.toLocaleString()} cards${!dry&&sel.length>200?` (about ${Math.ceil(sel.length*0.2/5)}s — keep this tab open)`:""}`;
  let res;
  try{
    res=await api("apply",{filters:S.filters,queries:S.queries,post_filters:S.post,action:S.action,tag:target,mode:S.mode,item_ids:sel.map(r=>r.item_id),dry_run:dry});
  }catch(e){
    S.phase="review"; render(); $("#confirmBtn").hidden=false; $("#dryWrap").hidden=false;
    $("#barmsg").innerHTML=`<span style="color:var(--warn)">${esc(e.message)}</span>`; return;
  }
  const isDry=res.status==="dry_run_completed";
  const written=new Set(isDry?sel.map(r=>r.item_id):(res.written_ids||[]));
  sel.forEach(r=>{ if(written.has(r.item_id)){ S.prev.set(r.item_id,r.tag); if(!isDry) r.tag=target; } });
  S.phase="done"; S.runId=res.run_id; S.dry=isDry; S.done=sel.filter(r=>written.has(r.item_id)); render();
  renderHistory();
  const verb=S.action==="set"?`tagged ${esc(S.tag)}`:"cleared";
  const failNote=(res.failed||res.mismatch)?` <span style="color:var(--warn)">${(res.failed||0)+(res.mismatch||0)} failed — see Recent runs (${esc(res.run_id)}).</span>`:"";
  const skipNote=res.skipped_no_longer_matching?` <span class="dim">${res.skipped_no_longer_matching} no longer matched and were skipped.</span>`:"";
  $("#barmsg").innerHTML=isDry?`<b>Dry run done.</b> ${S.done.length} cards would be ${verb}. Nothing was written.${skipNote}`:
    `<b class="done-badge" style="font-size:14px">✓ ${S.done.length} cards ${verb}.</b>${failNote}${skipNote} ${S.done.length?`<button class="btn link" id="undoBtn" type="button">Undo</button>`:""}`;
  const u=$("#undoBtn"); if(u) u.onclick=async()=>{
    const restoring=S.done.map(r=>({tag:S.prev.get(r.item_id)}));
    const ok=await ask({title:`Undo ${S.runId}?`,
      body:`This puts ${S.done.length} cards back to the tag they had before:${tagCounts(restoring)}<br>${S.action==="set"?`${esc(S.tag)} will be removed from them.`:"Their removed tags will be restored."}`,
      yes:"Yes, undo", danger:true});
    if(ok) undo();
  };
}
async function undo(){
  const sel=S.done; $("#barmsg").innerHTML=`<span class="spin"></span>Restoring previous tags… ${sel.length} cards`;
  let res;
  try{ res=await api("undo",{run_id:S.runId}); }
  catch(e){ $("#barmsg").innerHTML=`<span style="color:var(--warn)">${esc(e.message)}</span>`; return; }
  const back=new Set(res.written_ids||[]);
  sel.forEach(r=>{ if(back.has(r.item_id)) r.tag=S.prev.get(r.item_id); });
  renderHistory();
  $("#barmsg").innerHTML=`<b>Undone.</b> ${back.size} cards are back to their previous tags.${res.failed?` <span style="color:var(--warn)">${res.failed} failed.</span>`:""}`;
  S.undone=true; S.phase="done"; render();
}

/* ---------- new request ---------- */
function newRequest(){S=null;$("#summary").innerHTML="";$("#grid").innerHTML="";$("#empty").hidden=false;$("#empty").textContent="Type what you want tagged. You'll see every matching card before anything changes.";$("#bar").hidden=true;$("#confirmBtn").hidden=false;$("#dryWrap").hidden=false;$("#input").value="";$("#input").focus();scrollTo({top:0})}
$("#newBtn").onclick=newRequest;

/* ---------- tabs ---------- */
function showTab(name){
  for(const t of ["request","saved"]){
    const on=t===name;
    $("#tabBtn-"+t).setAttribute("aria-selected",on);
    $("#tab-"+t).hidden=!on;
  }
  $("#bar").hidden = name!=="request" || !S;
  if(name==="saved") renderSaved();
}
$("#tabBtn-request").onclick=()=>showTab("request");
$("#tabBtn-saved").onclick=()=>showTab("saved");
document.querySelector(".tabs").addEventListener("keydown",e=>{
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  const next=$("#tabBtn-request").getAttribute("aria-selected")==="true"?"saved":"request";
  showTab(next); $("#tabBtn-"+next).focus();
});

/* ---------- saved prompts (shared with the team, stored in Neon) ---------- */
let SAVED=[];
async function loadSaved(){ try{ SAVED=await api("prompts"); }catch{ SAVED=[]; } updateCount(); if(!$("#tab-saved").hidden) renderSaved(); }
function updateCount(){const c=$("#savedCount");c.hidden=!SAVED.length;c.textContent=SAVED.length}
function flash(msg){const n=$("#saveNote");n.textContent=msg;clearTimeout(flash.t);flash.t=setTimeout(()=>n.textContent="",2500)}
$("#saveBtn").onclick=async()=>{
  const v=$("#input").value.trim();
  if(!v){flash("Type a prompt first, then save it.");$("#input").focus();return}
  try{ await api("prompts",{text:v}); flash("Saved to Saved prompts."); loadSaved(); }
  catch(e){ flash(e.message); }
};
function renderSaved(){
  const el=$("#savedList");
  if(!SAVED.length){el.innerHTML=`<div class="empty">No saved prompts yet. On the Request tab, type a prompt and click Save prompt. Saved prompts are shared with everyone who signs in.</div>`;return}
  el.innerHTML=`<div class="saved">${SAVED.map(p=>`<div class="sp" data-id="${esc(p.id)}">
    <div><div class="nm">${esc(p.name)}</div><div class="tx">${esc(p.text)}</div><div class="tx">saved by ${esc(p.created_by)} · ${when(p.created_at)}</div></div>
    <div class="acts">
      <button class="btn primary" type="button" data-act="run">Run</button>
      <button class="btn" type="button" data-act="edit">Edit</button>
      <button class="btn" type="button" data-act="rename">Rename</button>
      <button class="btn" type="button" data-act="delete">Delete</button>
    </div></div>`).join("")}</div>`;
}
$("#savedList").addEventListener("click",async e=>{
  const b=e.target.closest("button[data-act]"); if(!b)return;
  const row=b.closest(".sp"); const p=SAVED.find(x=>x.id===row.dataset.id); if(!p)return;
  const act=b.dataset.act;
  if(act==="run"){showTab("request");$("#input").value=p.text;find(p.text);scrollTo({top:0})}
  else if(act==="edit"){showTab("request");$("#input").value=p.text;$("#input").focus()}
  else if(act==="rename"){
    const nm=row.querySelector(".nm");
    nm.innerHTML=`<input aria-label="Prompt name" value="${esc(p.name)}">`;
    const i=nm.querySelector("input"); i.focus(); i.select();
    let done=false;
    const commit=async()=>{ if(done)return; done=true; const v=i.value.trim(); if(v&&v!==p.name){ try{await api("prompts-rename",{id:p.id,name:v})}catch{} } loadSaved(); };
    i.onkeydown=ev=>{if(ev.key==="Enter")commit();if(ev.key==="Escape"){done=true;renderSaved()}};
    i.onblur=commit;
  }
  else if(act==="delete"){
    if(b.dataset.armed){ try{await api("prompts-delete",{id:p.id})}catch{} loadSaved(); }
    else{b.dataset.armed="1";b.textContent="Click again to delete";b.className="btn danger";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="Delete";b.className="btn"}},3000)}
  }
});

$("#form").onsubmit=e=>{e.preventDefault();clearTimeout(liveT);const v=$("#input").value.trim();if(v)find(v)};

/* request box grows with long prompts; Enter runs it, Shift+Enter adds a line */
const grow=()=>{const i=$("#input");i.style.height="auto";i.style.height=Math.min(i.scrollHeight+2,200)+"px"};
$("#input").addEventListener("input",grow);
$("#input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("#form").requestSubmit()}});
new MutationObserver(grow);
/* ---------- voice: talk into the request box (Chrome, Edge, Safari) ---------- */
(()=>{
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  const btn=$("#micBtn"), note=$("#voiceNote"), box=$("#input");
  if(!SR){ btn.title="Voice input needs Chrome, Edge or Safari"; btn.disabled=true; return; }
  const NUM={zero:0,one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10};
  // turn how people talk into how the box reads: "sd underscore wemby pack" -> "sd_wemby_pack", "p s a ten" -> "psa 10"
  const tidy=t=>t
    .replace(/\bhash ?tag\s+/gi,"#")
    .replace(/\s*\bunderscore\b\s*/gi,"_")
    .replace(/\bp\.? ?s\.? ?a\b/gi,"psa").replace(/\bb\.? ?g\.? ?s\b/gi,"bgs").replace(/\bs\.? ?g\.? ?c\b/gi,"sgc").replace(/\bc\.? ?g\.? ?c\b/gi,"cgc").replace(/\bc\.? ?s\.? ?g\b/gi,"csg")
    .replace(/\b(psa|bgs|beckett|sgc|cgc|csg|grade)\s+(zero|one|two|three|four|five|six|seven|eight|nine|ten)(\s+point\s+five)?\b/gi,(m,g,n,h)=>`${g} ${NUM[n.toLowerCase()]}${h?".5":""}`)
    .replace(/\b(\d+)\s+point\s+five\b/gi,"$1.5")
    .replace(/\b(\d[\d,]*)\s*dollars?\b/gi,"$$$1")
    .replace(/\s+([,.])/g,"$1").replace(/[.]\s*$/,"")
    .replace(/\s{2,}/g," ");
  let rec=null, listening=false, before="";
  const ui=on=>{ listening=on; btn.setAttribute("aria-pressed",on); btn.querySelector(".mictxt").textContent=on?" Stop":" Voice"; note.textContent=on?"Listening… speak, then click Stop (or just pause). You can edit the text before searching.":""; };
  const start=()=>{
    rec=new SR(); rec.lang="en-US"; rec.interimResults=true; rec.continuous=true;
    before=box.value.trim(); if(before) before+=" ";
    rec.onresult=e=>{
      let said=""; for(let i=0;i<e.results.length;i++) said+=e.results[i][0].transcript;
      box.value=before+tidy(said.trim());
      box.dispatchEvent(new Event("input",{bubbles:true}));
    };
    rec.onerror=e=>{
      ui(false);
      note.textContent=e.error==="not-allowed"||e.error==="service-not-allowed"
        ?"The microphone is blocked. Allow it for this site (the lock or camera icon in the address bar), then try again."
        :e.error==="no-speech"?"Didn't hear anything. Click Voice and try again.":`Voice stopped (${e.error}).`;
    };
    rec.onend=()=>{ if(listening){ ui(false); box.focus(); } };
    try{ rec.start(); ui(true); }catch{ ui(false); }
  };
  btn.onclick=()=>{ if(listening){ rec&&rec.stop(); ui(false); box.focus(); } else start(); };
})();

/* keep the results in step with the request box while you type */
let liveT;
$("#input").addEventListener("input",()=>{
  const v=$("#input").value.trim();
  if(!S||S.phase!=="review"||!v) return;
  const p=readRequest(v);
  // tag: fill the tag field immediately
  if(p.action===S.action&&p.tag&&p.tag!==S.tag){ S.tag=p.tag; recompute(false); }
  // searching happens on Enter / Find cards: every search is a fresh pull of 4131
});

/* ---------- sign-in + start-up ---------- */
async function showLogin(){
  $("#login").hidden=false; setTimeout(()=>$("#lname").focus(),0);
  try{ const c=await (await fetch("/api/ui/config",{credentials:"same-origin"})).json(); $("#lpassWrap").hidden=!c.password_required; $("#lpass").required=!!c.password_required; }catch{}
}
$("#loginForm").onsubmit=async e=>{
  e.preventDefault(); $("#lerr").textContent="";
  try{
    const r=await fetch("/api/ui/login",{method:"POST",credentials:"same-origin",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:$("#lname").value,password:$("#lpass").value})});
    const d=await r.json().catch(()=>({}));
    if(!r.ok){ $("#lerr").textContent=d.error||"Sign-in failed."; return; }
    $("#lpass").value=""; $("#login").hidden=true; boot();
  }catch{ $("#lerr").textContent="Network error."; }
};
$("#logoutBtn").onclick=async()=>{ await fetch("/api/ui/logout",{method:"POST",credentials:"same-origin"}); location.reload(); };
async function boot(){
  let me;
  try{ me=await api("me"); }catch{ return; }
  $("#whoami").textContent=`Signed in as ${me.user}`;
  window.MAX_ITEMS=me.max_items_per_run||100;
  const b=$("#modeBadge");
  if(me.dry_run){ b.textContent="DRY RUN — nothing is written"; b.className="mode"; $("#dry").checked=true; $("#dry").disabled=true; $("#foot").textContent="DRY_RUN is on in Vercel, so every run is recorded but nothing is written to admin."; }
  else{ b.textContent="LIVE — writes to admin"; b.className="mode live"; }
  loadSaved(); renderHistory();
}
boot();
</script>
